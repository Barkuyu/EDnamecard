<title>許振浩 電子名片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 版面構想：黑金金屬質感的手機單欄名片。拉絲底紋的頁首、金屬漸層的姓名與主按鈕，其餘為墨黑卡片搭配金色細線。 */
:root{
  --bg:#08080A; --card:#131315; --card-2:#1B1B1E; --ink:#F3EEE2; --muted:#A8A08E; --line:#2D291E;
  --gold:#D8B45A; --accent:#D8B45A; --accent-soft:#211B0C; --on-accent:#17110A;
  --metal:linear-gradient(135deg,#8A6A24 0%,#F0DA98 26%,#B8912F 48%,#F7E7B0 70%,#8F6F26 100%);
  --ok:#74D6A2; --ok-soft:#10261B; --bad:#FF9B90; --bad-soft:#321816; --warn-soft:#3A2F12; --warn-ink:#F2D98A;
  --font:"Noto Serif TC","Songti TC","PMingLiU","MingLiU","Source Han Serif TC",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:700;letter-spacing:.04em;border-left:3px solid var(--gold);padding-left:10px}
.sec{margin-top:20px}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 12px 28px rgba(0,0,0,.55)}
.todo{display:inline-block;background:var(--warn-soft);color:var(--warn-ink);border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:500}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 頁首 */
.hero{background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(180deg,#232326 0%,#0A0A0C 100%);margin:0 -16px;min-height:141px;padding:30px 16px 0;position:relative;overflow:hidden;text-align:center;background-size:cover;background-position:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(240,218,152,.12) 45%,transparent 60%);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--metal)}
.hero .unit{position:relative;z-index:1;display:inline-block;font-size:1.25rem;font-weight:900;letter-spacing:.16em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.idcard{margin-top:-24px;position:relative;z-index:2;padding:16px 16px 18px}
.idhead{display:flex;align-items:flex-start;gap:14px}
.idtext{flex:1;min-width:0}
.avatar{flex:0 0 108px;width:108px;height:108px;border-radius:50%;margin:0;border:3px solid transparent;background:linear-gradient(var(--card-2),var(--card-2)) padding-box,var(--metal) border-box;color:var(--gold);display:grid;place-items:center;font-size:2.6rem;font-weight:900;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{display:block;white-space:nowrap;overflow:hidden;text-align:right;font-size:1.75rem;font-weight:900;margin:0;letter-spacing:.06em;line-height:1.1;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.role{display:block;white-space:nowrap;text-align:right;margin:8px 0 0;color:#fff;font-size:10px;font-weight:700;line-height:1.5}
.role span{display:block}
.tagline{display:block;white-space:nowrap;width:100%;margin:10px 0 0;text-align:right;color:#fff;font-size:8px;font-weight:400;line-height:2.1}
.tagline span{display:block}

/* 按鈕列 */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{appearance:none;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-weight:700;border-radius:12px;padding:12px 8px;min-height:48px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--metal);border-color:transparent;color:var(--on-accent)}
.btn.wide{grid-column:1/-1}
.btn.wide img{flex:0 0 auto}
.btn[aria-disabled="true"]{opacity:.55}
.contact-lines{margin:12px 0 0;padding:0;list-style:none;font-size:.92rem;color:var(--muted);text-align:left}
.contact-lines li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.contact-lines span:first-child{flex:0 0 3.2em;color:var(--ink);font-weight:500}

/* 招考對象 */
.targets{display:grid;gap:10px}
.target{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.target .range{font-size:1.15rem;font-weight:900;color:var(--accent);white-space:nowrap}

/* 表格 */
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.rank{font-weight:700;white-space:nowrap}

/* 報考項目 */
.exams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exam{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.exam .t{font-weight:700}
.exam .d{font-size:.85rem;color:var(--muted);margin-top:2px}

/* 檢查器 */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.field.full{grid-column:1/-1}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.results{margin-top:14px;display:grid;gap:8px}
.res{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:.92rem}
.res .badge{flex:0 0 auto;font-weight:700;font-size:.78rem;border-radius:999px;padding:1px 10px;margin-top:2px}
.res.ok{background:var(--ok-soft)} .res.ok .badge{background:var(--ok);color:var(--card)}
.res.bad{background:var(--bad-soft)} .res.bad .badge{background:var(--bad);color:var(--card)}
.res.na{background:var(--warn-soft);color:var(--warn-ink)} .res.na .badge{background:var(--warn-ink);color:var(--card)}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0}

/* 折疊 */
details{border-bottom:1px solid var(--line);padding:2px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:500;padding:12px 24px 12px 0;list-style:none;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";position:absolute;right:0;color:var(--accent);font-weight:700}
details[open] summary::after{content:"－"}
details .ans{padding:0 0 12px;color:var(--muted);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:500}

.field-body{white-space:pre-line;line-height:1.8}
/* 聯絡按鈕（深底金框、圖示加文字） */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,12px);min-height:54px;padding:8px 8px;overflow:hidden;border:1.5px solid var(--gold);border-radius:12px;background:#0B0B0D;color:#ecdbb6;text-decoration:none;font-size:clamp(14px,4.3vw,17px);font-weight:500;letter-spacing:.02em;white-space:nowrap}
.cbtn.wide{grid-column:1/-1}
.cbtn svg,.cbtn img{flex:0 0 auto;width:clamp(21px,6vw,26px);height:clamp(21px,6vw,26px);display:block}
.cbtn[aria-disabled="true"]{opacity:.6;border-color:var(--line)}
.cbtn .todo{font-size:.6rem;padding:0 5px;margin-left:0}
@media (max-width:400px){.cbtn .todo{display:none}}
/* QR */
.qrcard{text-align:center}
#qrbox{display:inline-block;background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line);min-width:184px;min-height:184px}
#qrbox img,#qrbox canvas{display:block}
.qrsetup{margin-top:12px;text-align:left}
.qrsetup .row{display:flex;gap:8px}
.qrsetup .row input{flex:1}
.qrsetup .row .btn{padding:0 14px;min-height:44px}

footer{margin-top:24px;font-size:.78rem;color:var(--muted);text-align:center}

/* 對話框與提示 */
.modal{position:fixed;inset:0;background:rgba(10,12,18,.6);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px 24px;max-height:88%;overflow:auto}
.sheet h3{margin:0 0 6px}
.sheet pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.78rem;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto}
.sheet .row{display:flex;gap:10px;margin-top:12px}
.sheet .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<body>
<div class="wrap">

  <header class="hero">
    <div class="unit" id="unitName"></div>
  </header>

  <section class="card idcard" aria-label="名片">
    <div class="idhead">
      <div class="avatar" id="avatar"></div>
      <div class="idtext"><h1 class="name" id="personName"></h1><p class="role" id="personTitle"></p><p class="tagline" id="tagline"></p></div>
    </div>
    <div class="actions" id="actions"></div>
    <div class="cgrid" id="cgrid"></div>
    <ul class="contact-lines" id="contactLines"></ul>
  </section>

  <div id="fields"></div>

  <section class="sec" aria-labelledby="h-qr">
    <h2 id="h-qr">分享這張名片</h2>
    <div class="card qrcard">
      <div id="qrbox" role="img" aria-label="名片 QR code"></div>
      <p class="note" id="qrNote">用手機相機掃描，即可在手機上開啟這張名片。</p>
      <div class="qrsetup" id="qrSetup" hidden>
        <label for="qrUrl" class="note" style="display:block;margin:0 0 4px">名片網址（貼上後即產生 QR code）</label>
        <div class="row"><input id="qrUrl" type="url" placeholder="https://claude.ai/..."><button class="btn primary" id="qrMake" type="button">產生</button></div>
      </div>
    </div>
  </section>

  <footer>資訊僅供參考，詳情請洽招募顧問。<br><span id="year"></span> <span id="footUnit"></span></footer>
</div>

<div class="modal" id="vModal" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="sheet">
    <h3 id="vTitle">儲存聯絡人</h3>
    <p class="note" style="margin:0 0 10px">複製下方聯絡資料，貼到手機通訊錄；或用另一支手機掃描 QR code 直接加入。</p>
    <div style="text-align:center"><div id="vqr" style="display:inline-block;background:#fff;padding:10px;border-radius:10px"></div></div>
    <pre id="vText"></pre>
    <div class="row"><button class="btn primary" id="vCopy" type="button">複製聯絡資料</button><button class="btn" id="vClose" type="button">關閉</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

const toast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200); };

async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg||'已複製'); }
  catch(e){ toast('無法自動複製，請長按文字手動複製'); }
}

/* 頁首與身分 */
document.title = '許振浩 電子名片';
$('unitName').textContent = CONFIG.unit;
$('footUnit').textContent = CONFIG.company;
$('year').textContent = new Date().getFullYear();
$('personName').textContent = CONFIG.name;
$('personTitle').textContent = CONFIG.company + '｜' + CONFIG.title;
(function(){ const t=String(CONFIG.tagline||'').split('\n'); $('tagline').innerHTML = t.map(l=>'<span>'+esc(l)+'</span>').join(''); $('tagline').hidden = !has(CONFIG.tagline); })();
/* 封面圖：CONFIG.cover 填入 data: 開頭的圖片資料即可顯示，留空則用金屬底紋 */
if (has(CONFIG.cover)) document.querySelector('.hero').style.backgroundImage = 'linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55)),url("'+CONFIG.cover.replace(/"/g,'')+'")';
/* 姓名與副標題維持單行，內容變長時自動縮小字級 */
function fit(el,max,min){ el.style.fontSize=max+'px'; let s=max; while(el.scrollWidth>el.clientWidth && s>min){ s-=0.5; el.style.fontSize=s+'px'; } }
/* 讓文字剛好填滿所在欄位寬度（以 0.25px 為單位由大往小找） */
function fitFill(el,max,min){ let s=max; el.style.fontSize=s+'px'; while(el.scrollWidth>el.clientWidth+0.5 && s>min){ s-=0.25; el.style.fontSize=s+'px'; } }
function fitAll(){ fit($('personName'),28,16); fitFill($('personTitle'),22,8); fitFill($('tagline'),22,6); }
window.addEventListener('resize', fitAll);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
$('avatar').innerHTML = has(CONFIG.photo) ? '<img alt="'+esc(CONFIG.name)+'" src="'+esc(CONFIG.photo)+'">' : esc(CONFIG.name.charAt(0));
fitAll();

  '<div class="card field-body">'+esc(f.content)+'</div></section>').join('');

/* 聯絡人 vCard */
function vEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,'); }
function buildVCard(){
  const L = ['BEGIN:VCARD','VERSION:3.0',
    'N:'+vEsc(CONFIG.name.charAt(0))+';'+vEsc(CONFIG.name.slice(1))+';;;',
    'FN:'+vEsc(CONFIG.name),
    'ORG:'+vEsc(CONFIG.company),
    'TITLE:'+vEsc(CONFIG.title)];
  if (has(CONFIG.phone)) L.push('TEL;TYPE=CELL:'+vEsc(CONFIG.phone));
  if (has(CONFIG.email)) L.push('EMAIL:'+vEsc(CONFIG.email));
  if (has(CONFIG.lineUrl)) L.push('URL:'+CONFIG.lineUrl);
  if (has(CONFIG.address)) L.push('ADR;TYPE=WORK:;;'+vEsc(CONFIG.address)+';;;;');
  L.push('END:VCARD');
  return L.join('\n');
}
let vqrDone = false;
function openVModal(){
  const v = buildVCard();
  $('vText').textContent = v;
  const box = $('vqr'); box.innerHTML = '';
  try { new QRCode(box,{text:v,width:176,height:176,correctLevel:QRCode.CorrectLevel.M}); } catch(e){ box.textContent='QR 產生失敗'; }
  $('vModal').classList.add('open');
}
$('vClose').addEventListener('click', () => $('vModal').classList.remove('open'));
$('vModal').addEventListener('click', e => { if (e.target.id==='vModal') $('vModal').classList.remove('open'); });
$('vCopy').addEventListener('click', () => copyText(buildVCard(), '已複製聯絡資料'));
document.addEventListener('keydown', e => { if (e.key==='Escape') $('vModal').classList.remove('open'); });

/* 名片 QR code */
function drawQR(url){
  const box = $('qrbox'); box.innerHTML = '';
  try { new QRCode(box,{text:url,width:184,height:184,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ box.textContent = 'QR 產生失敗，請確認網址。'; }
}
(function(){
  let url = CONFIG.shareUrl;
  let saved = ''; try { saved = localStorage.getItem('cardShareUrl') || ''; } catch(e){}
  if (!has(url)) {
    $('qrSetup').hidden = false;
    if (has(saved)) { url = saved; $('qrUrl').value = saved; }
  }
  if (has(url)) drawQR(url);
  else $('qrbox').innerHTML = '<div style="width:184px;height:184px;display:grid;place-items:center;color:#667;font-size:.85rem;text-align:center">尚未設定網址<br>請在下方貼上</div>';
  $('qrMake').addEventListener('click', () => {
    const u = $('qrUrl').value.trim();
    if (!/^https?:\/\//i.test(u)) { toast('請貼上以 https:// 開頭的完整網址'); return; }
    drawQR(u); try { localStorage.setItem('cardShareUrl', u); } catch(e){}
    toast('已產生 QR code，可直接截圖或列印');
  });
})();
fitAll();
